global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Backend API metrics
  - job_name: 'engvox-backend'
    metrics_path: '/api/metrics'
    static_configs:
      - targets:
          - 'englishengineer-backend.onrender.com'
        labels:
          service: 'engvox-backend'
          environment: 'production'
    scheme: https
    scrape_interval: 30s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
