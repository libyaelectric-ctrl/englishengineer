services:
  - type: web
    name: englishengineer-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '8080'
      - key: SPEAKING_AUDIO_BUCKET
        value: speaking-audio
      - key: APP_ORIGIN
        value: https://engvox.com
      - key: SUPABASE_URL
        sync: false
        value: ''
      - key: SUPABASE_ANON_KEY
        sync: false
        value: ''
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
        value: ''
      # The project the running backend must be on. Set it to the ref inside SUPABASE_URL.
      # A mismatch refuses to start in production, so a migration applied to the wrong project
      # — or a hosting integration that provisions a second one — shows up at boot instead of
      # as "writes fail" behind a healthy-looking /api/health. Optional, but production warns
      # on every boot while it is unset.
      - key: EXPECTED_SUPABASE_PROJECT_REF
        sync: false
      - key: AI_PROVIDER
        sync: false
      - key: AI_MODEL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://engvox.com,https://www.engvox.com
      - key: FIREBASE_PROJECT_ID
        value: engvox-59b85
      - key: FIREBASE_SERVICE_ACCOUNT_KEY
        sync: false
        value: ''
