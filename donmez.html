<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Powered Orb</title>
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #020617; }
        canvas { display: block; outline: none; }
        /* Küre etrafına hafif bir parlama efekti */
        .orb-glow {
            box-shadow: 0 0 60px -10px rgba(56, 189, 248, 0.3);
            transition: box-shadow 0.3s ease;
        }
        .orb-glow.active {
            box-shadow: 0 0 80px -5px rgba(168, 85, 247, 0.6);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center text-white font-sans antialiased selection:bg-cyan-500/30">

    <!-- 3D Canvas Alanı -->
    <div id="canvas-container" class="w-72 h-72 md:w-96 md:h-96 relative rounded-full orb-glow mb-8 bg-slate-900/50 backdrop-blur-sm border border-slate-800"></div>

    <!-- Kontrol Butonu -->
    <button id="toggleBtn" class="group relative inline-flex items-center justify-center px-8 py-4 font-semibold text-white transition-all duration-200 bg-slate-800 rounded-full hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-cyan-500 focus:ring-offset-slate-900 border border-slate-700 hover:border-cyan-500/50">
        <span id="btnIcon" class="mr-3 transition-transform group-hover:scale-110">
            <!-- Mic Icon -->
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
        </span>
        <span id="btnText">Kaydı Başlat</span>
    </button>

    <!-- Durum Metni -->
    <p id="statusText" class="mt-6 text-sm text-slate-400 text-center max-w-md px-4">
        Ses kontrolünü etkinleştirmek için butona tıklayın. Konuştuğunuzda kürenin sesinize tepki verdiğini göreceksiniz.
    </p>

    <!-- Three.js (ES Modules via Import Map) -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- DOM Elementleri ---
        const container = document.getElementById('canvas-container');
        const toggleBtn = document.getElementById('toggleBtn');
        const btnText = document.getElementById('btnText');
        const btnIcon = document.getElementById('btnIcon');
        const statusText = document.getElementById('statusText');

        // --- State Değişkenleri ---
        let isRecording = false;
        let audioContext = null;
        let analyser = null;
        let dataArray = null;
        let animationFrameId = null;
        let targetAudioLevel = 0;
        let currentAudioLevel = 0;

        // --- Three.js Kurulumu ---
        const scene = new THREE.Scene();
        // Kamera
        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
        camera.position.z = 3.5;

        // Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // --- Shader Materyal ---
        const vertexShader = `
            uniform float uTime;
            uniform float uAudioLevel;
            varying vec2 vUv;
            varying vec3 vNormal;
            varying vec3 vPosition;

            // Simplex 3D Noise Fonksiyonu
            vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
            vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }
            
            float snoise(vec3 v) {
                const vec2 C = vec2(1.0/6.0, 1.0/3.0);
                const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
                vec3 i = floor(v + dot(v, C.yyy));
                vec3 x0 = v - i + dot(i, C.xxx);
                vec3 g = step(x0.yzx, x0.xyz);
                vec3 l = 1.0 - g;
                vec3 i1 = min(g.xyz, l.zxy);
                vec3 i2 = max(g.xyz, l.zxy);
                vec3 x1 = x0 - i1 + C.xxx;
                vec3 x2 = x0 - i2 + C.yyy;
                vec3 x3 = x0 - D.yyy;
                i = mod289(i);
                vec4 p = permute(permute(permute(
                            i.z + vec4(0.0, i1.z, i2.z, 1.0))
                        + i.y + vec4(0.0, i1.y, i2.y, 1.0))
                        + i.x + vec4(0.0, i1.x, i2.x, 1.0));
                float n_ = 0.142857142857;
                vec3 ns = n_ * D.wyz - D.xzx;
                vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
                vec4 x_ = floor(j * ns.z);
                vec4 y_ = floor(j - 7.0 * x_);
                vec4 x = x_ * ns.x + ns.yyyy;
                vec4 y = y_ * ns.x + ns.yyyy;
                vec4 h = 1.0 - abs(x) - abs(y);
                vec4 b0 = vec4(x.xy, y.xy);
                vec4 b1 = vec4(x.zw, y.zw);
                vec4 s0 = floor(b0)*2.0 + 1.0;
                vec4 s1 = floor(b1)*2.0 + 1.0;
                vec4 sh = -step(h, vec4(0.0));
                vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
                vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
                vec3 p0 = vec3(a0.xy, h.x);
                vec3 p1 = vec3(a0.zw, h.y);
                vec3 p2 = vec3(a1.xy, h.z);
                vec3 p3 = vec3(a1.zw, h.w);
                vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
                p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
                vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
                m = m * m;
                return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
            }

            void main() {
                vUv = uv;
                vNormal = normalize(normalMatrix * normal);
                vPosition = position;
                
                // Ses ve zamana bağlı gürültü tabanlı yer değiştirme
                float noise = snoise(position * 2.5 + uTime * 0.8);
                float displacement = noise * (0.15 + uAudioLevel * 0.7);
                
                vec3 newPosition = position + normal * displacement;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(newPosition, 1.0);
            }
        `;

        const fragmentShader = `
            uniform float uTime;
            uniform float uAudioLevel;
            varying vec2 vUv;
            varying vec3 vNormal;

            void main() {
                // Renk paleti (Camgöbeği -> Mor)
                vec3 color1 = vec3(0.2, 0.6, 1.0); 
                vec3 color2 = vec3(0.8, 0.3, 0.8); 
                
                float mixVal = sin(vUv.y * 3.14159 + uTime * 0.5) * 0.5 + 0.5;
                vec3 baseColor = mix(color1, color2, mixVal + uAudioLevel * 0.5);
                
                // Fresnel (Kenar parlaması)
                float fresnel = pow(1.0 - abs(dot(vNormal, vec3(0.0, 0.0, 1.0))), 2.5);
                vec3 glowColor = vec3(0.4, 0.9, 1.0);
                
                // Ses arttıkça parlama şiddetlenir
                vec3 finalColor = baseColor + glowColor * fresnel * (0.6 + uAudioLevel * 2.0);
                
                float alpha = 0.85 + uAudioLevel * 0.15;
                gl_FragColor = vec4(finalColor, alpha);
            }
        `;

        const uniforms = {
            uTime: { value: 0 },
            uAudioLevel: { value: 0 }
        };

        const geometry = new THREE.SphereGeometry(1, 64, 64);
        const material = new THREE.ShaderMaterial({
            vertexShader,
            fragmentShader,
            uniforms,
            transparent: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending
        });

        const orb = new THREE.Mesh(geometry, material);
        scene.add(orb);

        // --- Animasyon Döngüsü ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            
            const delta = clock.getDelta();
            uniforms.uTime.value += delta;

            // Ses seviyesini yumuşak bir şekilde (lerp) güncelle
            currentAudioLevel += (targetAudioLevel - currentAudioLevel) * 0.15;
            uniforms.uAudioLevel.value = currentAudioLevel;

            // Hafif dönüş efekti
            orb.rotation.y += delta * 0.2;
            orb.rotation.z += delta * 0.1;

            renderer.render(scene, camera);
        }
        animate();

        // --- Pencere Boyutlandırma ---
        window.addEventListener('resize', () => {
            const width = container.clientWidth;
            const height = container.clientHeight;
            renderer.setSize(width, height);
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
        });

        // --- Ses Analizi Mantığı ---
        async function startAudio() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                
                const source = audioContext.createMediaStreamSource(stream);
                source.connect(analyser);
                
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                
                analyzeAudio();
                updateUI(true);
            } catch (error) {
                console.error("Mikrofon erişim hatası:", error);
                statusText.textContent = "❌ Mikrofon erişimi reddedildi veya hata oluştu. Lütfen izin verin.";
                statusText.className = "mt-6 text-sm text-red-400 text-center max-w-md px-4";
            }
        }

        function analyzeAudio() {
            if (!isRecording || !analyser) return;
            
            animationFrameId = requestAnimationFrame(analyzeAudio);
            analyser.getByteFrequencyData(dataArray);
            
            // Ortalama ses seviyesini hesapla
            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) {
                sum += dataArray[i];
            }
            const average = sum / dataArray.length;
            
            // 0 ile 1 arasında normalize et (eşiği biraz yükselttik ki arka plan gürültüsüne tepki vermesin)
            targetAudioLevel = Math.min(average / 100, 1.0); 
            
            // UI güncellemesi (Ses algılandı mı?)
            if (targetAudioLevel > 0.15) {
                statusText.textContent = "🎤 Ses algılandı! Küre tepki veriyor.";
                container.classList.add('active');
            } else {
                statusText.textContent = "🎤 Dinleniyor... Konuşun.";
                container.classList.remove('active');
            }
        }

        function stopAudio() {
            isRecording = false;
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            if (audioContext) {
                audioContext.close();
                audioContext = null;
            }
            targetAudioLevel = 0;
            container.classList.remove('active');
            updateUI(false);
        }

        function updateUI(recording) {
            if (recording) {
                btnText.textContent = "Kaydı Durdur";
                toggleBtn.classList.replace('bg-slate-800', 'bg-red-500/20');
                toggleBtn.classList.replace('hover:bg-slate-700', 'hover:bg-red-500/30');
                toggleBtn.classList.replace('border-slate-700', 'border-red-500/50');
                toggleBtn.classList.add('text-red-400');
                
                // İkonu değiştir (Mic Off)
                btnIcon.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="2" x2="22" y1="2" y2="22"/><path d="M18.89 13.23A7.12 7.12 0 0 0 19 12v-2"/><path d="M5 10v2a7 7 0 0 0 12 5"/><path d="M15 9.34V5a3 3 0 0 0-5.68-1.33"/><path d="M9 9v3a3 3 0 0 0 5.12 2.12"/><line x1="12" x2="12" y1="19" y2="22"/></svg>`;
            } else {
                btnText.textContent = "Kaydı Başlat";
                toggleBtn.classList.replace('bg-red-500/20', 'bg-slate-800');
                toggleBtn.classList.replace('hover:bg-red-500/30', 'hover:bg-slate-700');
                toggleBtn.classList.replace('border-red-500/50', 'border-slate-700');
                toggleBtn.classList.remove('text-red-400');
                
                // İkonu değiştir (Mic)
                btnIcon.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>`;
                statusText.textContent = "Ses kontrolünü etkinleştirmek için butona tıklayın.";
            }
        }

        // --- Event Listener ---
        toggleBtn.addEventListener('click', () => {
            isRecording = !isRecording;
            if (isRecording) {
                startAudio();
            } else {
                stopAudio();
            }
        });

    </script>
</body>
</html>
