version: 2
updates:
  # ── Frontend (root) ──
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Europe/Istanbul
    open-pull-requests-limit: 10
    reviewers:
      - libyaelectric-ctrl
    labels:
      - dependencies
      - frontend
    commit-message:
      prefix: "chore(deps)"
      include: scope
    groups:
      patch-updates:
        patterns:
          - '*'
        update-types:
          - patch
      minor-updates:
        patterns:
          - '*'
        update-types:
          - minor
    ignore:
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      - dependency-name: 'vite'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
      - dependency-name: 'stripe'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-dom'
        update-types: ['version-update:semver-major']

  # ── Backend ──
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5
    reviewers:
      - libyaelectric-ctrl
    labels:
      - dependencies
      - backend
    commit-message:
      prefix: "chore(deps)"
      include: scope
    groups:
      backend-patch:
        patterns:
          - '*'
        update-types:
          - patch
      backend-minor:
        patterns:
          - '*'
        update-types:
          - minor
    ignore:
      - dependency-name: 'stripe'
        update-types: ['version-update:semver-major']

  # ── GitHub Actions ──
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Europe/Istanbul
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "chore(ci)"
      include: scope

  # ── Security: pip (if any Python scripts) ──
  # - package-ecosystem: pip
  #   directory: /
  #   schedule:
  #     interval: weekly

  # ── Docker ──
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Europe/Istanbul
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "chore(docker)"
      include: scope
