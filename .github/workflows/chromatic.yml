name: Chromatic Visual Regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**/*.tsx'
      - 'src/**/*.css'
      - '.storybook/**'

jobs:
  chromatic:
    name: Chromatic
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check Chromatic token
        id: chromatic-token
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        run: |
          if [ -n "$CHROMATIC_PROJECT_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Chromatic skipped because CHROMATIC_PROJECT_TOKEN is not configured."
          fi

      - name: Publish to Chromatic
        if: steps.chromatic-token.outputs.configured == 'true'
        continue-on-error: true
        uses: chromaui/action@2a0b63f30233c48591844a46d451b9cf68128186 # v18.7.2
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          buildScriptName: build-storybook
          onlyChanged: true
          exitOnceUploaded: true

      - name: Note optional visual result
        run: echo "Chromatic is non-blocking for release stabilization; local build/CI gates remain required."
