name: PR Summary

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]

permissions:
  pull-requests: write
  contents: read

jobs:
  summary:
    name: 📝 PR Summary Comment
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Post CI summary comment
        uses: actions/github-script@v7
        with:
          script: |
            const run = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
            });

            const prs = run.data.pull_requests || [];
            if (prs.length === 0) return;

            const prNumber = prs[0].number;
            const status = run.data.conclusion === 'success' ? '✅' : '❌';
            const sha = run.data.head_sha?.substring(0, 7) || 'unknown';
            const url = run.data.html_url;

            const body = `## 🤖 CI Status — ${status} ${run.data.conclusion?.toUpperCase()}

            | | |
            |---|---|
            | **Commit** | \`${sha}\` |
            | **Result** | ${run.data.conclusion === 'success' ? 'All checks passed' : 'One or more checks failed'} |
            | **Details** | [View workflow run](${url}) |

            <sub>🤖 Auto-generated by CI workflow</sub>`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('## 🤖 CI Status')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: body,
              });
            }
