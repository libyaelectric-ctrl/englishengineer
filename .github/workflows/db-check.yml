name: Database Check

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'backend/src/**/*.ts'
      - 'backend/test/audit-*.test.ts'
      - 'scripts/verify-audit-collision-attribution.mjs'
      - 'scripts/check-schema-identity.mjs'
      - 'scripts/fixtures/**'

jobs:
  validate-supabase:
    name: Validate Supabase Config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check RLS policies
        run: node scripts/verify-supabase-rls.mjs

      # A migration that declares a written identity column `uuid`, or points it at
      # `auth.users`, does not fail at deploy time — it fails at the first write, and in
      # the audit store that write is fail-closed, so the customer sees checkout refuse
      # with a 503 instead of a schema error. That happened once; this makes it a build
      # failure instead.
      - name: Check identity columns against the runtime identity model
        run: node scripts/check-schema-identity.mjs

      - name: Check migrations
        run: |
          if [ -d "supabase/migrations" ]; then
            echo "Migrations directory exists"
            ls supabase/migrations/
          else
            echo "No migrations directory found"
          fi

  audit-collision-attribution:
    name: Audit Collision Attribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - run: npm --prefix backend ci

      # Applies the real migrations to a throwaway Postgres, serves them through a
      # real PostgREST, and drives the real repository and audit seam: a collision
      # with the audited record must proceed, a collision on any other key must
      # fail closed. The other-constraint key exists only in that throwaway
      # database, so this is the only place the distinction is exercised for real.
      - name: Prove audit collision attribution
        run: npm run verify:audit-collision
