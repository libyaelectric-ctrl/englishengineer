name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".vscode/**"
      - "public/mascot/**"
      - "public/agentic/**"
      - "public/brand/**"
      - "storybook-static/**"
      - ".storybook/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".vscode/**"
      - "public/mascot/**"
      - "public/agentic/**"
      - "public/brand/**"
      - "storybook-static/**"
      - ".storybook/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Cache node_modules between jobs
defaults:
  run:
    shell: bash

jobs:
  # ─── Parallel: Secret scan runs independently ───
  secret-scan:
    name: 🔒 Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── Parallel: Code quality checks ───
  quality:
    name: 🔍 Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type Check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Architecture Check
        run: npx depcruise src backend/src --config .dependency-cruiser.mjs

  # ─── Parallel: Tests (no dependency on quality) ───
  test:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Frontend Unit Tests
        run: npm test

      - name: Frontend E2E Tests (Vitest)
        run: npm run e2e

      - name: Test Coverage
        run: npm run test:coverage

      - name: Enforce Coverage Thresholds
        run: |
          echo "=== Coverage Threshold Enforcement ==="
          if [ -f coverage/coverage-summary.json ]; then
            LINES=$(node -e "const j=JSON.parse(require('fs').readFileSync('coverage/coverage-summary.json','utf8'));console.log(j.total.lines.pct)")
            BRANCHES=$(node -e "const j=JSON.parse(require('fs').readFileSync('coverage/coverage-summary.json','utf8'));console.log(j.total.branches.pct)")
            FUNCTIONS=$(node -e "const j=JSON.parse(require('fs').readFileSync('coverage/coverage-summary.json','utf8'));console.log(j.total.functions.pct)")
            echo "Lines: ${LINES}% (min: 40%)"
            echo "Branches: ${BRANCHES}% (min: 30%)"
            echo "Functions: ${FUNCTIONS}% (min: 35%)"
            FAIL=0
            if [ "$(echo "$LINES < 40" | bc -l)" -eq 1 ]; then echo "::error::Lines coverage below 40%"; FAIL=1; fi
            if [ "$(echo "$BRANCHES < 30" | bc -l)" -eq 1 ]; then echo "::error::Branches coverage below 30%"; FAIL=1; fi
            if [ "$(echo "$FUNCTIONS < 35" | bc -l)" -eq 1 ]; then echo "::error::Functions coverage below 35%"; FAIL=1; fi
            if [ "$FAIL" -eq 1 ]; then exit 1; fi
            echo "Coverage thresholds met ✅"
          else
            echo "Coverage report not found, skipping enforcement"
          fi

      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ─── Parallel: Backend checks ───
  backend:
    name: ⚙️ Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Backend
        run: npm --prefix backend ci

      - name: Backend Typecheck
        run: npm --prefix backend run typecheck

      - name: Backend Tests
        run: npm run backend:test

  # ─── Sequential: Build (needs quality + test + backend all green) ───
  build:
    name: 📦 Build
    runs-on: ubuntu-latest
    needs: [quality, test, backend]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Check bundle size
        run: |
          echo "=== Bundle Size Budget ==="
          INITIAL_JS=$(grep -oE '(src|href)="/assets/[^"]+\.js"' dist/index.html | sed -E 's/^(src|href)="//;s/"$//')
          JS_SIZE=0
          for f in $INITIAL_JS; do
            SIZE=$(stat -c%s "dist${f}" 2>/dev/null || echo 0)
            JS_SIZE=$((JS_SIZE + SIZE))
          done
          CSS_SIZE=$(du -sb dist/assets/*.css 2>/dev/null | awk '{s+=$1}END{print s}')
          JS_LIMIT=3000000
          CSS_LIMIT=200000
          echo "Initial-load JS: ${JS_SIZE} bytes (limit: ${JS_LIMIT})"
          echo "CSS: ${CSS_SIZE:-0} bytes (limit: ${CSS_LIMIT})"
          FAIL=0
          if [ "${JS_SIZE:-0}" -gt "$JS_LIMIT" ]; then
            echo "::error::JS bundle too large"
            FAIL=1
          fi
          if [ "${CSS_SIZE:-0}" -gt "$CSS_LIMIT" ]; then
            echo "::error::CSS bundle too large"
            FAIL=1
          fi
          if [ "$FAIL" -eq 1 ]; then exit 1; fi
          echo "Bundle size OK ✅"

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 3

  # ─── Sequential: E2E (needs build) ───
  e2e:
    name: 🎭 E2E Tests
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 25
    env:
      HAS_CLERK: ${{ secrets.CLERK_SECRET_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Backend
        run: npm --prefix backend ci

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright Dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run E2E Tests
        if: ${{ env.HAS_CLERK == 'true' }}
        run: >-
          npx playwright test tests/e2e
          tests/browser/mobile-learning.spec.ts
          tests/browser/stripe-billing.spec.ts
          tests/browser/olympus.production.spec.ts
          --project=chromium-desktop
        env:
          CI: true
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  # ─── Final: Status gate for branch protection ───
  ci-complete:
    name: ✅ CI Complete
    runs-on: ubuntu-latest
    if: always()
    needs: [secret-scan, quality, test, backend, build, e2e]
    steps:
      - name: Check all jobs
        run: |
          echo "=== CI Summary ==="
          echo "Secret Scan: ${{ needs.secret-scan.result }}"
          echo "Code Quality: ${{ needs.quality.result }}"
          echo "Tests: ${{ needs.test.result }}"
          echo "Backend: ${{ needs.backend.result }}"
          echo "Build: ${{ needs.build.result }}"
          echo "E2E: ${{ needs.e2e.result }}"
          if [ "${{ needs.quality.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.backend.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error::One or more required jobs failed"
            exit 1
          fi
          echo "All checks passed ✅"
