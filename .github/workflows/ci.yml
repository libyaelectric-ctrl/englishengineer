name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type Check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Architecture Check
        run: npx depcruise src backend/src --config .dependency-cruiser.mjs

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit Tests
        run: npm test

      - name: Test Coverage
        run: npm run test:coverage

      - name: Enforce Coverage Thresholds
        run: |
          echo "=== Coverage Threshold Enforcement ==="
          if [ -f coverage/coverage-summary.json ]; then
            LINES=$(cat coverage/coverage-summary.json | node -e "const d=require('fs').readFileSync('/dev/stdin','utf8');const j=JSON.parse(d);console.log(j.total.lines.pct)")
            BRANCHES=$(cat coverage/coverage-summary.json | node -e "const d=require('fs').readFileSync('/dev/stdin','utf8');const j=JSON.parse(d);console.log(j.total.branches.pct)")
            FUNCTIONS=$(cat coverage/coverage-summary.json | node -e "const d=require('fs').readFileSync('/dev/stdin','utf8');const j=JSON.parse(d);console.log(j.total.functions.pct)")
            echo "Lines: ${LINES}% (min: 60%)"
            echo "Branches: ${BRANCHES}% (min: 50%)"
            echo "Functions: ${FUNCTIONS}% (min: 55%)"
            FAIL=0
            if [ "$(echo "$LINES < 60" | bc -l)" -eq 1 ]; then echo "FAIL: Lines coverage below threshold"; FAIL=1; fi
            if [ "$(echo "$BRANCHES < 50" | bc -l)" -eq 1 ]; then echo "FAIL: Branches coverage below threshold"; FAIL=1; fi
            if [ "$(echo "$FUNCTIONS < 55" | bc -l)" -eq 1 ]; then echo "FAIL: Functions coverage below threshold"; FAIL=1; fi
            if [ "$FAIL" -eq 1 ]; then exit 1; fi
            echo "Coverage thresholds met"
          else
            echo "Coverage report not found, skipping enforcement"
          fi

      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Install Backend
        run: npm --prefix backend ci

      - name: Backend Typecheck
        run: npm --prefix backend run typecheck

      - name: Backend Tests
        run: npm run backend:test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Check bundle size
        run: |
          echo "=== Bundle Size Budget ==="
          # Measure only what the browser downloads on initial page load
          # (the entry script + modulepreload chunks listed in
          # index.html), not every lazy-loaded route/page chunk in
          # dist/assets/. See deploy-production.yml for the same fix and
          # a longer explanation.
          INITIAL_JS=$(grep -oE '(src|href)="/assets/[^"]+\.js"' dist/index.html | sed -E 's/^(src|href)="//;s/"$//')
          JS_SIZE=0
          for f in $INITIAL_JS; do
            SIZE=$(stat -c%s "dist${f}" 2>/dev/null || echo 0)
            JS_SIZE=$((JS_SIZE + SIZE))
          done
          CSS_SIZE=$(du -sb dist/assets/*.css 2>/dev/null | awk '{s+=$1}END{print s}')
          JS_LIMIT=2000000
          CSS_LIMIT=200000
          echo "Initial-load JS: ${JS_SIZE} bytes (limit: ${JS_LIMIT})"
          echo "CSS: ${CSS_SIZE:-0} bytes (limit: ${CSS_LIMIT})"
          FAIL=0
          if [ "${JS_SIZE:-0}" -gt "$JS_LIMIT" ]; then
            echo "FAIL: JS bundle too large"
            FAIL=1
          fi
          if [ "${CSS_SIZE:-0}" -gt "$CSS_LIMIT" ]; then
            echo "FAIL: CSS bundle too large"
            FAIL=1
          fi
          if [ "$FAIL" -eq 1 ]; then exit 1; fi
          echo "Bundle size OK"

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 3
