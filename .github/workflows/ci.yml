name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md', '.vscode/**', 'public/mascot/**', 'public/agentic/**', 'public/brand/**', 'storybook-static/**', '.storybook/**']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', '**.md', '.vscode/**', 'public/mascot/**', 'public/agentic/**', 'public/brand/**', 'storybook-static/**', '.storybook/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  secret-scan:
    name: 🔒 Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality:
    name: 🔍 Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Type Check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Architecture Check
        run: npx depcruise src backend/src --config .dependency-cruiser.mjs
      - name: Dead Code Detection
        run: npm run check:dead-code

  test:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Frontend Unit Tests
        run: npm test
      - name: Vitest Peak Memory Measurement
        run: |
          /usr/bin/time -v npm test 2>&1 | grep -E 'Maximum resident|tests|pass|fail' | tee /tmp/mem.txt || true
          PEAK=$(grep 'Maximum resident' /tmp/mem.txt | awk '{print $NF}' || echo 'N/A')
          echo "### Vitest Peak Memory" >> $GITHUB_STEP_SUMMARY
          echo "Peak RSS: ${PEAK} kB" >> $GITHUB_STEP_SUMMARY
      - name: Frontend E2E Tests (Vitest)
        run: npm run e2e
      - name: Test Coverage
        run: npm run test:coverage
      - name: Verify Release Consistency
        run: node scripts/verify-release.mjs
      - name: Enforce Coverage Thresholds
        run: |
          echo "=== Coverage Threshold Enforcement ==="
          if [ -f coverage/coverage-summary.json ]; then
            LINES=$(node -e "const j=JSON.parse(require('fs').readFileSync('coverage/coverage-summary.json','utf8'));console.log(j.total.lines.pct)")
            BRANCHES=$(node -e "const j=JSON.parse(require('fs').readFileSync('coverage/coverage-summary.json','utf8'));console.log(j.total.branches.pct)")
            FUNCTIONS=$(node -e "const j=JSON.parse(require('fs').readFileSync('coverage/coverage-summary.json','utf8'));console.log(j.total.functions.pct)")
            FAIL=0
            if [ "$(echo "$LINES < 40" | bc -l)" -eq 1 ]; then FAIL=1; fi
            if [ "$(echo "$BRANCHES < 30" | bc -l)" -eq 1 ]; then FAIL=1; fi
            if [ "$(echo "$FUNCTIONS < 35" | bc -l)" -eq 1 ]; then FAIL=1; fi
            if [ "$FAIL" -eq 1 ]; then exit 1; fi
          else
            echo "Coverage report not found, skipping enforcement"
          fi
      - name: Upload Coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: { name: coverage-report, path: coverage/, retention-days: 7 }

  backend:
    name: ⚙️ Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Install Backend
        run: npm --prefix backend ci
      - name: Backend Typecheck
        run: npm --prefix backend run typecheck
      - name: Backend Tests
        run: npm run backend:test

  build:
    name: 📦 Build
    runs-on: ubuntu-latest
    needs: [quality, test, backend]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Check bundle size
        run: |
          INITIAL_JS=$(grep -oE '(src|href)="/assets/[^"]+\.js"' dist/index.html | sed -E 's/^(src|href)="//;s/"$//')
          JS_SIZE=0
          for f in $INITIAL_JS; do SIZE=$(stat -c%s "dist${f}" 2>/dev/null || echo 0); JS_SIZE=$((JS_SIZE + SIZE)); done
          CSS_SIZE=$(du -sb dist/assets/*.css 2>/dev/null | awk '{s+=$1}END{print s}')
          if [ "${JS_SIZE:-0}" -gt 3000000 ] || [ "${CSS_SIZE:-0}" -gt 200000 ]; then exit 1; fi
      - name: Upload Build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: dist, path: dist/, retention-days: 3 }

  e2e:
    name: 🎭 E2E Tests
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Install Backend
        run: npm --prefix backend ci
      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright Dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Run unauthenticated smoke E2E
        run: npx playwright test tests/browser/landing-and-health.spec.ts --project=chromium-desktop --no-deps
        env: { CI: true }
      - name: Visual Regression Baselines
        run: |
          npx playwright test tests/e2e/visual-regression.spec.ts --project=visual-regression --update-snapshots || true
          npx playwright test tests/e2e/visual-regression.spec.ts --project=visual-regression
        env: { BASE_URL: 'http://localhost:4176', CI: true }
      - name: Upload Visual Baselines
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: { name: visual-baselines, path: test-results/, retention-days: 14 }
      - name: Upload Playwright Report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: { name: playwright-report, path: test-results/, retention-days: 7 }

  ci-complete:
    name: ✅ CI Complete
    runs-on: ubuntu-latest
    if: always()
    needs: [secret-scan, quality, test, backend, build, e2e]
    steps:
      - name: Check all jobs
        run: |
          echo "Secret Scan: ${{ needs.secret-scan.result }}"
          echo "Code Quality: ${{ needs.quality.result }}"
          echo "Tests: ${{ needs.test.result }}"
          echo "Backend: ${{ needs.backend.result }}"
          echo "Build: ${{ needs.build.result }}"
          echo "E2E: ${{ needs.e2e.result }}"
          if [ "${{ needs.secret-scan.result }}" != "success" ] || [ "${{ needs.quality.result }}" != "success" ] || [ "${{ needs.test.result }}" != "success" ] || [ "${{ needs.backend.result }}" != "success" ] || [ "${{ needs.build.result }}" != "success" ] || [ "${{ needs.e2e.result }}" != "success" ]; then
            exit 1
          fi
          echo "All checks passed"
