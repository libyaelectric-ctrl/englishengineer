name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type Check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Architecture Check
        run: npx depcruise src backend/src --config .dependency-cruiser.mjs

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit Tests
        run: npm test

      - name: Test Coverage
        run: npm run test:coverage

      - name: Enforce Coverage Thresholds
        run: |
          echo "=== Coverage Threshold Enforcement ==="
          if [ -f coverage/coverage-summary.json ]; then
            LINES=$(cat coverage/coverage-summary.json | node -e "const d=require('fs').readFileSync('/dev/stdin','utf8');const j=JSON.parse(d);console.log(j.total.lines.pct)")
            BRANCHES=$(cat coverage/coverage-summary.json | node -e "const d=require('fs').readFileSync('/dev/stdin','utf8');const j=JSON.parse(d);console.log(j.total.branches.pct)")
            FUNCTIONS=$(cat coverage/coverage-summary.json | node -e "const d=require('fs').readFileSync('/dev/stdin','utf8');const j=JSON.parse(d);console.log(j.total.functions.pct)")
            echo "Lines: ${LINES}% (min: 38%)"
            echo "Branches: ${BRANCHES}% (min: 28%)"
            echo "Functions: ${FUNCTIONS}% (min: 34%)"
            FAIL=0
            if [ "$(echo "$LINES < 38" | bc -l)" -eq 1 ]; then echo "FAIL: Lines coverage below threshold"; FAIL=1; fi
            if [ "$(echo "$BRANCHES < 28" | bc -l)" -eq 1 ]; then echo "FAIL: Branches coverage below threshold"; FAIL=1; fi
            if [ "$(echo "$FUNCTIONS < 34" | bc -l)" -eq 1 ]; then echo "FAIL: Functions coverage below threshold"; FAIL=1; fi
            if [ "$FAIL" -eq 1 ]; then exit 1; fi
            echo "Coverage thresholds met"
          else
            echo "Coverage report not found, skipping enforcement"
          fi

      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Install Backend
        run: npm --prefix backend ci

      - name: Backend Typecheck
        run: npm --prefix backend run typecheck

      - name: Backend Tests
        run: npm run backend:test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Check bundle size
        run: |
          echo "=== Bundle Size Budget ==="
          INITIAL_JS=$(grep -oE '(src|href)="/assets/[^"]+\.js"' dist/index.html | sed -E 's/^(src|href)="//;s/"$//')
          JS_SIZE=0
          for f in $INITIAL_JS; do
            SIZE=$(stat -c%s "dist${f}" 2>/dev/null || echo 0)
            JS_SIZE=$((JS_SIZE + SIZE))
          done
          CSS_SIZE=$(du -sb dist/assets/*.css 2>/dev/null | awk '{s+=$1}END{print s}')
          JS_LIMIT=1500000
          CSS_LIMIT=150000
          echo "Initial-load JS: ${JS_SIZE} bytes (limit: ${JS_LIMIT})"
          echo "CSS: ${CSS_SIZE:-0} bytes (limit: ${CSS_LIMIT})"
          FAIL=0
          if [ "${JS_SIZE:-0}" -gt "$JS_LIMIT" ]; then
            echo "FAIL: JS bundle too large"
            FAIL=1
          fi
          if [ "${CSS_SIZE:-0}" -gt "$CSS_LIMIT" ]; then
            echo "FAIL: CSS bundle too large"
            FAIL=1
          fi
          if [ "$FAIL" -eq 1 ]; then exit 1; fi
          echo "Bundle size OK"

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 3

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The Playwright webServer starts the backend too (see playwright.config.ts),
      # so backend dependencies must be installed before the tests run.
      - name: Install Backend
        run: npm --prefix backend ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      # Lock-system smoke test: signs in as a real free-tier Clerk user
      # (tests/e2e/lock-system.spec.ts). CLERK_SECRET_KEY and
      # VITE_CLERK_PUBLISHABLE_KEY must be the pair from the same Clerk dev
      # instance — configure them in GitHub → Settings → Secrets and variables
      # → Actions. Without the secret the suite skips locally, so CI fails fast
      # here instead of silently passing.
      - name: Verify Clerk secret configured
        run: |
          if [ -z "${{ secrets.CLERK_SECRET_KEY }}" ]; then
            echo "::error::CLERK_SECRET_KEY secret is not configured. Add it (with VITE_CLERK_PUBLISHABLE_KEY) in GitHub → Settings → Secrets and variables → Actions."
            exit 1
          fi

      # Scoped to the lock-system smoke test: the remaining browser/e2e specs
      # are legacy demo-login flows that predate the Clerk migration and are
      # kept for local reference until they are updated.
      - name: Run E2E Tests
        run: npx playwright test tests/e2e/lock-system.spec.ts --project=chromium-desktop
        env:
          CI: true
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
