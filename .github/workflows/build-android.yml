name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npx vite build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_BILLING_API_URL: ${{ secrets.VITE_BILLING_API_URL }}

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Initialize Capacitor
        run: |
          npx cap add android || true
          npx cap sync android

      # Decode keystore from base64 secret (if configured)
      - name: Decode Keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

      - name: Build APK (Debug)
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Build APK (Release)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -f "app/release.keystore" ]; then
            ./gradlew assembleRelease
          else
            echo "No keystore found — building unsigned release APK"
            ./gradlew assembleRelease
          fi

      # Build AAB (Android App Bundle) for Play Store
      - name: Build AAB (Release)
        working-directory: android
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: engvox-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: engvox-release.apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        with:
          name: engvox-release.aab
          path: android/app/build/outputs/bundle/release/app-release.aab

  # MOBILE.md deep-link smoke test: installs the debug APK on an emulator and
  # asserts the Google OAuth return path end to end — the com.engvox.app custom
  # scheme resolves to the app, appUrlOpen fires on the injected return link,
  # the app reloads after forwarding, and the WebView lands on the callback URL
  # with Clerk's params replayed
  # (https://localhost/?__clerk_handshake=1#/oauth-callback). See MOBILE.md §3.
  smoke-test:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    steps:
      - name: Download Debug APK
        uses: actions/download-artifact@v4
        with:
          name: engvox-debug.apk

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Run deep-link smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          script: |
            set -e
            export PATH="$ANDROID_SDK_ROOT/platform-tools:$PATH"

            # 1. The custom scheme must resolve to the app (MOBILE.md §3).
            RESOLVED="$(adb shell cmd package resolve-activity --brief \
              -a android.intent.action.VIEW \
              -d 'com.engvox.app://oauth-callback?__clerk_handshake=1&__clerk_handshake_nonce=ci-smoke')"
            echo "$RESOLVED"
            echo "$RESOLVED" | grep -q 'com.engvox.app/.MainActivity' \
              || { echo '❌ custom scheme did not resolve to the app'; exit 1; }

            adb install -r engvox-debug.apk

            # 2. Fresh logcat, launch, then inject the OAuth return deep link.
            adb logcat -c
            adb shell am force-stop com.engvox.app
            adb shell am start -W -n com.engvox.app/.MainActivity >/dev/null
            adb shell am start -W -a android.intent.action.VIEW \
              -d 'com.engvox.app://oauth-callback?__clerk_handshake=1&__clerk_handshake_nonce=ci-smoke' \
              com.engvox.app >/dev/null || true

            # 3. appUrlOpen must fire, and the reload after forwarding must show
            #    a second boot (boot + post-forward reload = 2 occurrences).
            for i in $(seq 1 20); do
              adb logcat -d | grep -q 'Notifying listeners for event appUrlOpen' && break
              sleep 1
            done
            adb logcat -d | grep -q 'Notifying listeners for event appUrlOpen' \
              || { echo '❌ appUrlOpen event not observed'; exit 1; }
            [ "$(adb logcat -d | grep -c 'EngVox Kernel Booting')" -ge 2 ] \
              || { echo '❌ app did not reload after forwarding'; exit 1; }

            # 4. Assert the callback URL state via WebView DevTools
            #    (MainActivity enables setWebContentsDebuggingEnabled).
            PID="$(adb shell pidof com.engvox.app | tr -d '[:space:]')"
            adb forward tcp:9222 "localabstract:webview_devtools_remote_$PID" >/dev/null
            TARGETS=""
            for i in $(seq 1 20); do
              TARGETS="$(curl -s http://127.0.0.1:9222/json 2>/dev/null || true)"
              echo "$TARGETS" | grep -q 'oauth-callback' && break
              sleep 1
            done
            # buildOAuthForwardUrl replays ALL deep-link params, so the nonce
            # is part of the final URL (verified by native-oauth.test.ts).
            echo "$TARGETS" | grep -q 'https://localhost/?__clerk_handshake=1&__clerk_handshake_nonce=ci-smoke#/oauth-callback' \
              || { echo '❌ WebView did not land on the callback URL'; echo "$TARGETS"; exit 1; }
            echo '✅ deep-link smoke test passed'
