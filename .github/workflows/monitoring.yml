name: Monitoring Report

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  report:
    name: Weekly Monitoring Report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Bundle Size Report
        run: |
          npm run build
          echo "## Bundle Size Report" > report.md
          echo "" >> report.md
          echo "| File | Size |" >> report.md
          echo "|------|------|" >> report.md
          du -sh dist/assets/*.js | while read size file; do
            echo "| $(basename $file) | $size |" >> report.md
          done
          du -sh dist/assets/*.css | while read size file; do
            echo "| $(basename $file) | $size |" >> report.md
          done

      - name: Test Summary
        run: |
          echo "" >> report.md
          echo "## Test Summary" >> report.md
          echo "" >> report.md
          npm test -- --reporter=json > test-results.json 2>&1 || true
          if [ -f test-results.json ]; then
            echo "Tests completed. See test-results.json for details." >> report.md
          fi

      - name: Backend Test Summary
        run: |
          echo "" >> report.md
          echo "## Backend Test Summary" >> report.md
          echo "" >> report.md
          cd backend && npm test 2>&1 | tail -10 >> ../report.md || true

      - name: Security Audit
        run: |
          echo "" >> report.md
          echo "## Security Audit" >> report.md
          echo ""
          npm audit --json > audit-results.json 2>&1 || true
          if [ -f audit-results.json ]; then
            VULNS=$(node -e "
              try {
                const d = JSON.parse(require('fs').readFileSync('audit-results.json', 'utf-8'));
                console.log(d.metadata?.vulnerabilities?.total ?? 'unknown');
              } catch { console.log('unknown'); }
            ")
            echo "Vulnerabilities: $VULNS" >> report.md
          fi

      - name: Dependency freshness
        run: |
          echo "" >> report.md
          echo "## Dependency Freshness" >> report.md
          echo "" >> report.md
          npm outdated --json > outdated.json 2>&1 || true
          if [ -f outdated.json ]; then
            OUTDATED=$(node -e "
              try {
                const d = JSON.parse(require('fs').readFileSync('outdated.json', 'utf-8'));
                console.log(Object.keys(d).length);
              } catch { console.log('0'); }
            ")
            echo "Outdated packages: $OUTDATED" >> report.md
          fi

      - name: Type Coverage
        run: |
          echo "" >> report.md
          echo "## Type Coverage" >> report.md
          echo "" >> report.md
          echo "Frontend: \`npm run typecheck\` (exit code $?)" >> report.md
          echo "Backend: \`npm run backend:typecheck\` (exit code $?)" >> report.md

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-report
          path: report.md
          retention-days: 30
