name: GitHub Pages deploy

# Static hosting for the SPA after the Vercel account-wide provisioning lock
# (TD-023). Builds exactly what the app always shipped (npm ci + vite) and
# publishes it to GitHub Pages behind engvox.com. The Vercel workflow stays in
# place: the day the support ticket clears, flipping DNS back is one commit.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The public build inputs the Vercel project already carries. Without them a
      # Pages build has no data CDN prefix, so the seed loaders fall back to the
      # site's own /data/* paths, which no clean checkout contains (public/data is
      # gitignored) - the learning content would render empty. Values are public by
      # design (they ship in the client bundle), and the repository already carries
      # the same defaults in src/test/setup.ts and billing.helpers.ts.
      - name: Build
        run: npm run build
        env:
          # VITE_APP_VERSION is deliberately absent: the app falls back to PRODUCT_VERSION
          # (package.json), whereas a git ref would display "main" as the version.
          VITE_ENVIRONMENT_MODE: production
          VITE_SITE_URL: https://engvox.com
          VITE_DATA_CDN_URL: ${{ vars.VITE_DATA_CDN_URL || 'https://wxabrwzitwsjtpmlvvqe.supabase.co/storage/v1/object/public/app-data' }}
          VITE_BILLING_API_URL: ${{ vars.VITE_BILLING_API_URL || 'https://englishengineer-backend.onrender.com' }}
          VITE_AI_PROVIDER: backend
          VITE_AI_PROXY_URL: ${{ vars.VITE_AI_PROXY_URL || 'https://englishengineer-backend.onrender.com/api/v1/ai' }}
          VITE_AUTH_PROVIDER: firebase
      - run: node scripts/gh-pages-prepare.mjs
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: page-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
