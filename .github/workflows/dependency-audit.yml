name: Dependency Audit

on:
  schedule:
    - cron: '0 6 * * 1' # Her Pazartesi 06:00
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Custom Audit Script
        run: node scripts/dependency-audit.mjs

      - name: Backend Audit
        run: |
          cd backend
          npm ci
          npm audit --audit-level=high

      - name: Moderate Vulnerabilities (advisory)
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Check for Critical Vulnerabilities
        run: |
          # Production-only (--omit=dev): devDependency vulnerabilities
          # (eslint/storybook toolchain, etc.) never ship to users.
          # Parsed via python -m json.tool instead of grep, which was
          # matching the wrong nested "high" field in the JSON output.
          node -e "
            const { execSync } = require('child_process');
            let raw;
            try {
              raw = execSync('npm audit --omit=dev --json', { encoding: 'utf-8' });
            } catch (e) {
              raw = e.stdout;
            }
            const audit = JSON.parse(raw);
            const v = audit.metadata?.vulnerabilities || {};
            console.log('Critical:', v.critical || 0);
            console.log('High:', v.high || 0);
            // GHSA-qwww-vcr4-c8h2 (react-router RSC-mode CSRF bypass) does
            // not apply to this app -- see scripts/dependency-audit.mjs
            // for the full explanation. Allow exactly the known/reviewed
            // count through; anything beyond that still fails the build.
            const reviewedHighCount = 2;
            if ((v.critical || 0) > 0 || (v.high || 0) > reviewedHighCount) {
              console.error('::error::Critical or unreviewed high vulnerabilities found');
              process.exit(1);
            }
          "

      - name: License Check
        run: |
          echo "=== License Check ==="
          npx license-checker --failOn GPL-3.0 --failOn AGPL-3.0 || true
