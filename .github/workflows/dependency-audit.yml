name: Dependency Audit

on:
  schedule:
    - cron: '0 6 * * 1'
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Custom Audit Script
        run: node scripts/dependency-audit.mjs

      - name: Backend Audit
        run: |
          cd backend
          npm ci
          npm audit --audit-level=high

      - name: Moderate Vulnerabilities (advisory)
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Production Dependency Audit
        run: node scripts/dependency-audit.mjs

      - name: License Check
        run: |
          echo "=== License Check ==="
          npx license-checker --failOn GPL-3.0 --failOn AGPL-3.0 || true
