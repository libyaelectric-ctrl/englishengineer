<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - EngVox</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8f9fa;
      color: #1c1d22;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .container {
      max-width: 400px;
      text-align: center;
    }
    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 1.5rem;
      background: #fee2e2;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon svg {
      width: 32px;
      height: 32px;
      color: #dc2626;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    p {
      color: #5b5d72;
      margin-bottom: 1.5rem;
      line-height: 1.6;
    }
    .retry-btn {
      background: #0066ff;
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .retry-btn:hover {
      background: #0052cc;
    }
    .offline-features {
      margin-top: 2rem;
      text-align: left;
      background: white;
      border-radius: 12px;
      padding: 1rem;
      border: 1px solid #e9ecef;
    }
    .offline-features h2 {
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    .offline-features ul {
      list-style: none;
      font-size: 0.875rem;
      color: #5b5d72;
    }
    .offline-features li {
      padding: 0.25rem 0;
    }
    .offline-features li::before {
      content: "✓ ";
      color: #16a34a;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M1 1l22 22M16.72 11.06A10.94 10.94 0 0 1 19 12.55M5 12.55a10.94 10.94 0 0 1 5.17-2.39M10.71 5.05A16 16 0 0 1 22.56 9M1.42 9a15.91 15.91 0 0 1 4.7-2.88M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01"/>
      </svg>
    </div>
    <h1>You're Offline</h1>
    <p>No internet connection detected. Some features require an active connection.</p>
    <button class="retry-btn" onclick="window.location.reload()">Try Again</button>
    <div class="offline-features">
      <h2>Available Offline:</h2>
      <ul>
        <li>Vocabulary practice</li>
        <li>Grammar lessons</li>
        <li>Reading exercises</li>
        <li>Writing practice</li>
        <li>Site dictionary</li>
      </ul>
    </div>
  </div>
</body>
</html>
