server {
    listen 8080;
    server_name _;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml application/wasm;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.gstatic.com https://www.google.com https://accounts.google.com https://engvox.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://engvox.com; img-src 'self' data: https: https://*.googleusercontent.com https://*.google.com https://engvox.com; connect-src 'self' https://englishengineer-backend.onrender.com https://generativelanguage.googleapis.com https://*.supabase.co wss://*.supabase.co https://engvox.com wss://engvox.com https://firestore.googleapis.com; font-src 'self' https://engvox.com; object-src 'none'; media-src 'self'; frame-src 'self' https://accounts.google.com https://www.google.com https://engvox.com; frame-ancestors 'none'; form-action 'self'; base-uri 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        set $backend_upstream http://backend:8080;
        resolver 127.0.0.11 valid=30s ipv6=off;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
